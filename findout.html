
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Out</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Main card */

        .card {
            width: 260px;
            height: 450px;
            flex-shrink: 0;

            background: black;
            border-radius: 20px;
            padding: 18px 14px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
        }


        /* Heading */

        h1 {
            color: white;
            font-size: 38px;
            line-height: 1.4;
            letter-spacing: -2px;
        }

        h1 span {
            color: red;
        }

        /* Input fields */

        .input-fields {
            margin-top: 38px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        input {
            width: 100%;
            height: 38px;
            border: 1px solid red;
            border-radius: 30px;
            background: #dedede;
            padding: 0 15px;
            font-size: 9px;
            outline: none;
        }

        input:focus {
            border: 2px solid red;
        }

        .scared-button {
            width: 70px;
            height: 18px;
            margin-top: 20px;
            margin-left: 79px;
            background: #680700;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
        }

        /* Bottom illustration */

        .illustration {
            margin-top: auto;
            height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration img {
            width: 180px;
            height: 120px;
            object-fit: contain;
        }
        html {
            overflow-y: scroll;
        }

        body {
            width: 100%;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

    </style>
    <script src="script.js" defer></script>
</head>

<body>

    <div class="card">

        <h1>
            LET'S<br>
            FIND <span>OUT</span>
        </h1>

        <div class="input-fields">

            <input
                type="text"
                id = "riotId"
                placeholder="ENTER RIOT ID"
            >

            <input
                type="text"
                id="tagline"
                placeholder="ENTER TAGLINE"
            >

        </div>

        <button class="scared-button" id="searchButton">
            SCARED?
        </button>

        <div class="illustration">

            <img src="images/orb.png" alt="Purple energy orb">

        </div>

    </div>

</body>
</html>
