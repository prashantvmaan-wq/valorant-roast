
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Exposed</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="card">

        <h1>
            PLAYER<br>
            <span>EXPOSED</span>
        </h1>

        <div class="player-info">
            <h2 id="displayName">PLAYER NAME</h2>
            <p id="displayTag">#TAGLINE</p>
            <p id="agent">AGENT: --</p>
        </div>

        <div class="stats-grid">

            <div class="stat-box">
                <p>KILLS</p>
                <span id="kills">--</span>
            </div>

            <div class="stat-box">
                <p>DEATHS</p>
                <span id="deaths">--</span>
            </div>

            <div class="stat-box">
                <p>ASSISTS</p>
                <span id="assists">--</span>
            </div>

            <div class="stat-box">
                <p>K/D RATIO</p>
                <span id="kd">--</span>
            </div>

            <div class="stat-box">
                <p>HEADSHOT %</p>
                <span id="headshot">--</span>
            </div>

            <div class="stat-box">
                <p>ACS</p>
                <span id="acs">--</span>
            </div>

        </div>

        <div class="card-navigation">

            <a href="findout.html" class="nav-button">
                ← BACK
            </a>

            <a href="weapon.html" class="nav-button">
                NEXT →
            </a>

        </div>

        <div class="verdict">
            <p id="roast">YOUR ROAST WILL APPEAR HERE</p>
        </div>

        <img
            src="images/agent.jpg"
            alt="Valorant agent"
            class="agent-image"
        >

    </div>

</body>
</html>
