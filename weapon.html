
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weapon Roast</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="card">

        <h1>
            WEAPON<br>
            <span>ROAST</span>
        </h1>

        <div class="stats-grid">

            <div class="stat-box">
                <p>HEADSHOT %</p>
                <span id="weaponHeadshot">--</span>
            </div>

            <div class="stat-box">
                <p>WEAPON KILLS</p>
                <span id="weaponKills">--</span>
            </div>

            <div class="stat-box">
                <p>WORST WEAPON</p>
                <span id="worstWeapon">--</span>
            </div>

            <div class="stat-box">
                <p>BODY SHOTS</p>
                <span id="bodyShots">--</span>
            </div>

            <div class="card-navigation">
                <a href="player.html" class="nav-button">
                    ← BACK
                </a>
            </div>

        </div>

        <div class="verdict">
            <p>FINAL WEAPON VERDICT</p>
            <span id="weaponVerdict">--</span>
        </div>

        <img
            src="images/gun.png"
            alt="Valorant weapon"
            class="weapon-image"
        >

    </div>

</body>
</html>
